name: Test    # 워크플로우 이름

on:
  push:
    branches: [김준철-sprint11]
  pull_request:
    branches: [김준철-sprint11]

jobs:
  kimcode-test:
    runs-on: ubuntu-latest
    
    steps:
      # 1단계: 코드 가져오기
      - name: Checkout code
        uses: actions/checkout@v5
      
      # 2단계: Node.js 설치
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
      
      # 3단계: 패키지 설치
      - name: Install dependencies
        run: npm install
      
      # 4단계: 타입 체크
      - name: Type Check
        run: npm run typecheck
      
      # 5단계: 테스트 실행
      - name: Run Tests
        run: npm run test
